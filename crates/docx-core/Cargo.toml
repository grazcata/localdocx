[package]
name = "docx-core"
version = "0.1.0"
edition = "2021"
authors = ["grazcata"]
description = "Moteur Rust natif local-first pour manipuler et générer des documents .docx"
license = "MIT OR Apache-2.0"

[dependencies]
docx-rs = "0.4.17"
zip = "0.6.6"
quick-xml = "0.31"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
