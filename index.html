<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LocalDocx • Éditeur Word Hors-ligne</title>
  <meta name="description" content="Éditeur de documents DOCX 100% local-first et hors-ligne pour Android et PC. Vos fichiers restent sur votre appareil.">
  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 108 108'><rect width='108' height='108' rx='24' fill='%23103F91'/><path d='M44 28h32a4 4 0 0 1 4 4v42a4 4 0 0 1-4 4H44a4 4 0 0 1-4-4V32a4 4 0 0 1 4-4z' fill='%23E8F1FC'/><path d='M52 38h20M52 45h20M52 52h20M52 59h14' stroke='%232B78D4' stroke-width='2.5' stroke-linecap='round'/><path d='M24 36h28a4 4 0 0 1 4 4v28a4 4 0 0 1-4 4H24a4 4 0 0 1-4-4V40a4 4 0 0 1 4-4z' fill='%23185ABD'/><path d='M27 44l4 20 5-20 4 20 4-20h5l-6 21-5-17-5 17-6-21z' fill='%23FFF'/><circle cx='76' cy='72' r='13' fill='%2310B981'/><rect x='68' y='67' width='16' height='10' rx='2' fill='%23059669' stroke='%23FFF' stroke-width='1.6'/><line x1='71' y1='74' x2='79' y2='74' stroke='%23FFF' stroke-width='1.4' stroke-linecap='round'/><circle cx='81.5' cy='74' r='0.8' fill='%23FFF'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top App Bar -->
  <header class="app-bar">
    <div class="app-bar-left">
      <button id="btn-open-drawer" class="icon-btn" title="Mes documents" aria-label="Menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <div class="title-container">
        <input type="text" id="doc-title" value="Mon Document" placeholder="Titre du document..." spellcheck="false">
        <span id="save-status" class="save-status">Enregistré</span>
      </div>
    </div>

    <div class="app-bar-right">
      <label for="import-file-input" class="icon-btn" title="Ouvrir un fichier .docx">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5-5 5 5M12 5v12"/></svg>
      </label>
      <input type="file" id="import-file-input" accept=".docx" style="display: none;">

      <button id="btn-export-docx" class="btn-primary" title="Télécharger le fichier .docx sur votre téléphone">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        <span>DOCX</span>
      </button>

      <button id="theme-toggle" class="icon-btn" title="Changer le thème">
        <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
    </div>
  </header>

  <!-- Mobile Formatting Toolbar (Scrollable) -->
  <nav class="toolbar" id="toolbar">
    <div class="toolbar-group">
      <select id="heading-select" class="toolbar-select">
        <option value="p">Texte normal</option>
        <option value="h1">Titre 1</option>
        <option value="h2">Titre 2</option>
        <option value="h3">Titre 3</option>
      </select>
    </div>

    <div class="toolbar-sep"></div>

    <div class="toolbar-group">
      <button class="t-btn" data-cmd="bold" title="Gras (Ctrl+B)"><b>B</b></button>
      <button class="t-btn" data-cmd="italic" title="Italique (Ctrl+I)"><i>I</i></button>
      <button class="t-btn" data-cmd="underline" title="Souligné (Ctrl+U)"><u>U</u></button>
      <button class="t-btn" data-cmd="strikeThrough" title="Barré"><s>S</s></button>
      <button class="t-btn" id="btn-highlight" title="Surligner"><span class="highlight-badge">A</span></button>
    </div>

    <div class="toolbar-sep"></div>

    <div class="toolbar-group">
      <button class="t-btn" data-cmd="justifyLeft" title="Aligner à gauche">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 6H3M15 12H3M17 18H3"/></svg>
      </button>
      <button class="t-btn" data-cmd="justifyCenter" title="Centrer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6H6M21 12H3M18 18H6"/></svg>
      </button>
      <button class="t-btn" data-cmd="justifyRight" title="Aligner à droite">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 6H3M21 12H9M21 18H7"/></svg>
      </button>
      <button class="t-btn" data-cmd="justifyFull" title="Justifier">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 6H3M21 12H3M21 18H3"/></svg>
      </button>
    </div>

    <div class="toolbar-sep"></div>

    <div class="toolbar-group">
      <button class="t-btn" data-cmd="insertUnorderedList" title="Puces">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6h12M9 12h12M9 18h12M4 6h1M4 12h1M4 18h1"/></svg>
      </button>
      <button class="t-btn" data-cmd="insertOrderedList" title="Numéros">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 6h11M10 12h11M10 18h11M4 6h1v4M4 10h2M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"/></svg>
      </button>
      <button class="t-btn" data-cmd="formatBlock" data-val="blockquote" title="Citation">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1zM15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"/></svg>
      </button>
      <button class="t-btn" data-cmd="insertTable" title="Insérer un tableau">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>
      </button>
      <button class="t-btn" data-cmd="insertHorizontalRule" title="Ligne de séparation">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg>
      </button>
    </div>

    <div class="toolbar-sep"></div>

    <div class="toolbar-group">
      <button class="t-btn" data-cmd="undo" title="Annuler">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6M3 13a9 9 0 0 1 15-5.36"/></svg>
      </button>
      <button class="t-btn" data-cmd="redo" title="Rétablir">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6M21 13a9 9 0 0 0-15-5.36"/></svg>
      </button>
    </div>
  </nav>

  <!-- Document Viewport -->
  <main class="editor-container">
    <div class="page-sheet">
      <div id="editor" contenteditable="true" spellcheck="true" role="textbox" aria-multiline="true"></div>
    </div>
  </main>

  <!-- Bottom Status Bar -->
  <footer class="status-bar">
    <div class="stats-pill">
      <span id="word-count">0 mots</span>
      <span class="dot">•</span>
      <span id="char-count">0 car.</span>
      <span class="dot">•</span>
      <span id="read-time">~1 min</span>
    </div>
    <div class="status-right">
      <button id="btn-print-doc" class="text-btn" title="Imprimer ou enregistrer en PDF">Imprimer / PDF</button>
      <span class="privacy-badge">🔒 100% Hors-ligne</span>
    </div>
  </footer>

  <!-- Drawer: Documents Manager -->
  <div id="drawer-overlay" class="drawer-overlay"></div>
  <aside id="drawer" class="drawer">
    <div class="drawer-header">
      <div class="drawer-title-area">
        <div class="app-logo">
          <svg width="32" height="32" viewBox="0 0 108 108">
            <rect width="108" height="108" rx="24" fill="#103F91"/>
            <path d="M44 28h32a4 4 0 0 1 4 4v42a4 4 0 0 1-4 4H44a4 4 0 0 1-4-4V32a4 4 0 0 1 4-4z" fill="#E8F1FC"/>
            <path d="M52 38h20M52 45h20M52 52h20M52 59h14" stroke="#2B78D4" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M24 36h28a4 4 0 0 1 4 4v28a4 4 0 0 1-4 4H24a4 4 0 0 1-4-4V40a4 4 0 0 1 4-4z" fill="#185ABD"/>
            <path d="M27 44l4 20 5-20 4 20 4-20h5l-6 21-5-17-5 17-6-21z" fill="#FFF"/>
            <circle cx="76" cy="72" r="13" fill="#10B981"/>
            <rect x="68" y="67" width="16" height="10" rx="2" fill="#059669" stroke="#FFF" stroke-width="1.6"/>
            <line x1="71" y1="74" x2="79" y2="74" stroke="#FFF" stroke-width="1.4" stroke-linecap="round"/>
            <circle cx="81.5" cy="74" r="0.8" fill="#FFF"/>
          </svg>
        </div>
        <div>
          <h3>LocalDocx</h3>
          <p>Mes fichiers locaux</p>
        </div>
      </div>
      <button id="btn-close-drawer" class="icon-btn" title="Fermer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="drawer-actions">
      <button id="btn-new-doc" class="btn-create-doc">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        Nouveau document
      </button>
    </div>

    <div class="drawer-content">
      <div class="doc-list" id="doc-list">
        <!-- Rendered by JS -->
      </div>
    </div>

    <div class="drawer-footer">
      <p class="drawer-footer-text">Tous les documents sont stockés en local sur votre appareil Android.</p>
    </div>
  </aside>

  <!-- Bundled Scripts -->
  <script src="dist/vendor.bundle.js"></script>
  <script src="dist/app.bundle.js"></script>
</body>
</html>
